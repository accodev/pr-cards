name: e2e

# Drives real Claude Code and Pi sessions in a pseudo-terminal: dots, hover card, tracking, the band's
# keys. A fake model in tests/e2e/model.ts gives the replies, so no API key is needed; `gh` reads
# pullywog's own PRs with the workflow's token.
on:
  push:
    branches: [main]
    paths: [claude/**, pi/**, tests/e2e/**, package.json, package-lock.json, .github/workflows/e2e.yml]
  pull_request:
    paths: [claude/**, pi/**, tests/e2e/**, package.json, package-lock.json, .github/workflows/e2e.yml]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  claude-code:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      # From the lockfile in .github/tools/test, pinned by hash. Installed outside the checkout: claude plugin validate counts the plugin's files.
      - name: Install Claude Code
        run: |
          cp .github/tools/test/package.json .github/tools/test/package-lock.json "$RUNNER_TEMP"
          npm ci --prefix "$RUNNER_TEMP" --no-audit --no-fund
          echo "$RUNNER_TEMP/node_modules/.bin" >> "$GITHUB_PATH"
      # node-pty and the headless xterm screen.
      - name: Install the terminal driver
        run: npm ci

      - name: Run
        run: npm run e2e:claude

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: e2e-claude-code
          path: e2e-out

  pi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      # From the lockfile in .github/tools/test, pinned by hash. Installed outside the checkout: claude plugin validate counts the plugin's files.
      - name: Install Pi
        run: |
          cp .github/tools/test/package.json .github/tools/test/package-lock.json "$RUNNER_TEMP"
          npm ci --prefix "$RUNNER_TEMP" --no-audit --no-fund
          echo "$RUNNER_TEMP/node_modules/.bin" >> "$GITHUB_PATH"
      # The extension imports pi-tui from the repo's node_modules, the run node-pty and xterm.
      - name: Install the dev packages
        run: npm ci

      - name: Run
        run: npm run e2e:pi

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: e2e-pi
          path: e2e-out
